services:
  listen:
    image: tianjian518/listen:2.2.0
    # 想本地自己构建可改成：build: .
    container_name: listen
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - MUSIC_PANEL_CONFIG=/data/config.json
      - MUSIC_PANEL_DOWNLOADS=/data/downloads
    volumes:
      - listen-data:/data
    restart: unless-stopped

volumes:
  listen-data:
